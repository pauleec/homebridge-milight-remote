<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiBoxer 3D Cutaway Smart Home Twin (:8588)</title>
<style>
  :root { --bg:#0b1324; --panel:#111c33; --card:#172542; --bdr:#293b5f; --txt:#f8fafc; --mut:#94a3b8; --acc:#38bdf8; --rf:#22c55e; --ui:#f59e0b; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,sans-serif; }
  .app { display:grid; grid-template-columns:1fr 330px; height:100vh; width:100vw; }
  @media(max-width:960px){ .app { grid-template-columns:1fr; } aside { display:none; } }
  #vp { position:relative; width:100%; height:100%; overflow:hidden; background:#0b1324; }
  #vp canvas { display:block; width:100%; height:100%; }
  .hud-top { position:absolute; top:12px; left:12px; right:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; z-index:10; pointer-events:none; }
  .hud-grp { pointer-events:auto; display:flex; gap:5px; flex-wrap:wrap; background:rgba(15,23,42,.86); backdrop-filter:blur(8px); border:1px solid var(--bdr); padding:6px 8px; border-radius:9px; }
  .chip { background:#1e293b; color:#e2e8f0; border:1px solid #334155; border-radius:6px; padding:5px 10px; font-size:11.5px; font-weight:700; cursor:pointer; }
  .chip:hover { border-color:var(--acc); color:#fff; }
  #remDock { position:absolute; top:60px; left:12px; width:222px; background:rgba(15,23,42,.90); backdrop-filter:blur(10px); border:1px solid var(--bdr); border-radius:11px; padding:10px; z-index:12; box-shadow:0 10px 25px rgba(0,0,0,.4); }
  #remDock.min #remDockBody { display:none; } #remDock.min { width:auto; }
  #remDock.hit-rf { border-color:var(--rf); box-shadow:0 0 18px rgba(34,197,94,.4); }
  #remDock.hit-ui { border-color:var(--ui); box-shadow:0 0 18px rgba(245,158,11,.4); }
  .rd-tabs, .rd-zones { display:flex; gap:4px; flex-wrap:wrap; margin:6px 0; justify-content:center; }
  .rd-btn { padding:3px 7px; font-size:10px; font-weight:800; border-radius:5px; border:1px solid var(--bdr); background:#1e293b; color:#cbd5e1; cursor:pointer; }
  .rd-btn.active { background:#ea580c; border-color:#f97316; color:#fff; }
  #rdSvg { display:flex; justify-content:center; align-items:center; min-height:205px; background:rgba(8,13,26,.75); border:1px solid var(--bdr); border-radius:8px; padding:8px; overflow:hidden; }
  #rdSvg svg { max-height:195px; max-width:170px; width:auto!important; height:auto!important; display:block; user-select:none; }
  .mbx-hit { cursor:pointer; }
  .mbx-hit.zone-active > circle, .mbx-hit.zone-active > rect, circle.mbx-hit.zone-active, rect.mbx-hit.zone-active { stroke:#f97316!important; stroke-width:2.5px!important; }
  .mbx-hit.fire-rf > rect, .mbx-hit.fire-rf > circle, rect.mbx-hit.fire-rf, circle.mbx-hit.fire-rf { fill:#86efac!important; stroke:#16a34a!important; stroke-width:3px!important; }
  .mbx-hit.fire-ui > rect, .mbx-hit.fire-ui > circle, rect.mbx-hit.fire-ui, circle.mbx-hit.fire-ui { fill:#fde68a!important; stroke:#d97706!important; stroke-width:3px!important; }
  #labelsLayer { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:8; }
  .m3d-lbl { position:absolute; transform:translate(-50%,-100%); pointer-events:auto; background:rgba(255,255,255,.93); color:#0f172a; border:1px solid #cbd5e1; box-shadow:0 3px 10px rgba(0,0,0,.28); border-radius:6px; padding:3px 8px; font-size:11px; font-weight:700; white-space:nowrap; cursor:pointer; }
  .m3d-lbl .exp-hint { display:none; font-size:9.5px; color:#ea580c; margin-left:5px; }
  .m3d-lbl:hover .exp-hint { display:inline; }
  .m3d-lbl.on { border-color:#16a34a; }
  .m3d-lbl.pulse-act { border-color:#ea580c!important; background:#fff7ed!important; transform:translate(-50%,-112%) scale(1.07); z-index:15; }
  #toastBar { position:absolute; bottom:14px; left:14px; right:14px; background:rgba(255,255,255,.95); color:#0f172a; border:1px solid #cbd5e1; border-radius:9px; padding:9px 14px; font-size:13px; z-index:11; box-shadow:0 6px 20px rgba(0,0,0,.28); }
  aside { background:var(--panel); border-left:1px solid var(--bdr); padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:9px; }
  .dcard { background:var(--card); border:1px solid var(--bdr); border-radius:8px; padding:9px 11px; }
  .dcard-hdr { display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:700; margin-bottom:6px; }
  .dcard input[type=range] { width:100%; accent-color:#38bdf8; cursor:pointer; }
</style>
</head>
<body>
<div class="app">
  <div id="vp">
    <div class="hud-top">
      <div class="hud-grp">
        <span style="font-weight:800;font-size:13px;padding:4px 6px;color:#38bdf8">🏠 MiBoxer 3D Smart Home Twin</span>
        <button class="chip" onclick="eng.setCam(0,15,19, 0,0.5,2)">Overview</button>
        <button class="chip" onclick="eng.setCam(-2,11,8, -2,0,-1.5)">Rooms</button>
        <button class="chip" onclick="eng.setCam(6,8,11, 4.2,0,-1)">Garage</button>
        <button class="chip" onclick="eng.setCam(0,7,18, 0,0,6.5)">Garden &amp; Gate</button>
        <button class="chip" onclick="eng.zoomBy(-2.5)">＋</button>
        <button class="chip" onclick="eng.zoomBy(2.5)">－</button>
      </div>
      <div class="hud-grp">
        <button class="chip" onclick="sendCmd('scene_mode',{scene:'day'})">☀ Day</button>
        <button class="chip" onclick="sendCmd('scene_mode',{scene:'sunset'})">🌅 Sunset</button>
        <button class="chip" onclick="sendCmd('scene_mode',{scene:'night'})">🌙 Night</button>
        <button class="chip" onclick="sendCmd('scene_mode',{scene:'party'})">🎵 Beat Chase</button>
      </div>
    </div>

    <div id="remDock">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:11.5px;font-weight:800">🎛️ Live Remotes</span>
        <span id="rdBadge" style="font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:99px;background:#1e293b;color:#94a3b8">READY</span>
        <button class="chip" style="padding:1px 6px" onclick="document.getElementById('remDock').classList.toggle('min')">_</button>
      </div>
      <div id="remDockBody">
        <div class="rd-tabs" id="rdTabs"></div>
        <div class="rd-zones" id="rdZones"></div>
        <div id="rdSvg"></div>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;margin-top:6px"><span>🟢 Physical RF</span><span>🟠 UI Click</span></div>
      </div>
    </div>

    <div id="labelsLayer"></div>
    <div id="toastBar">Drag to Orbit • Right-Drag to Pan • Scroll to Zoom • Press any Physical Remote or Click a 3D Room!</div>
  </div>

  <aside>
    <div style="font-size:14px;font-weight:800">10 Virtual Smart Home Targets</div>
    <div id="sideList" style="display:flex;flex-direction:column;gap:8px"></div>
  </aside>
</div>

<script src="/miboxer_catalog.js"></script>
<script src="/three.min.js"></script>
<script>

function createCutawaySmartHome3D(opts) {
  const vp = opts.viewport;
  const getStateMap = opts.getStateMap;
  const onToggleDevice = opts.onToggleDevice;
  const lblLayer = opts.labelsLayer;

  const w0 = vp.clientWidth || 960, h0 = vp.clientHeight || 580;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(opts.darkDefault ? 0x0f172a : 0xbae6fd);

  const camera = new THREE.PerspectiveCamera(42, w0 / h0, 0.1, 130);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w0, h0);
  renderer.shadowMap.enabled = true;
  if (THREE.PCFSoftShadowMap) renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  vp.appendChild(renderer.domElement);

  const target = new THREE.Vector3(0, 0.5, 2.0);
  const curTarget = target.clone();
  let theta = 0.0, phi = 0.92, radius = 23.2;
  let curTheta = theta, curPhi = phi, curRadius = radius;
  let dragging = false, dragBtn = 0, prevX = 0, prevY = 0, downX = 0, downY = 0;

  function setCam(px, py, pz, tx, ty, tz) {
    target.set(tx, ty, tz);
    const dx = px - tx, dy = py - ty, dz = pz - tz;
    radius = Math.max(5.5, Math.min(40, Math.sqrt(dx*dx + dy*dy + dz*dz)));
    theta = Math.atan2(dx, dz);
    phi = Math.max(0.18, Math.min(Math.PI * 0.46, Math.acos(dy / radius)));
  }
  function zoomBy(d) {
    radius = Math.max(5.5, Math.min(40, radius + d));
  }

  const pickables = [];
  function regP(obj, tid) {
    obj.traverse(function(c) {
      if (c.isMesh) { c.userData.tid = tid; pickables.push(c); }
    });
  }

  const rc = new THREE.Raycaster(), pt = new THREE.Vector2();
  renderer.domElement.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  renderer.domElement.addEventListener('pointerdown', function(e) {
    dragging = true; dragBtn = e.button;
    prevX = downX = e.clientX; prevY = downY = e.clientY;
    try { renderer.domElement.setPointerCapture(e.pointerId); } catch (_) {}
  });
  renderer.domElement.addEventListener('pointermove', function(e) {
    if (!dragging) return;
    const dx = e.clientX - prevX, dy = e.clientY - prevY;
    prevX = e.clientX; prevY = e.clientY;
    if (dragBtn === 2 || e.shiftKey) {
      const panScale = curRadius * 0.0016;
      const right = new THREE.Vector3(Math.cos(curTheta), 0, -Math.sin(curTheta));
      const fwd = new THREE.Vector3(-Math.sin(curTheta), 0, -Math.cos(curTheta));
      target.addScaledVector(right, -dx * panScale);
      target.addScaledVector(fwd, dy * panScale);
    } else {
      theta -= dx * 0.0075;
      phi = Math.max(0.18, Math.min(Math.PI * 0.46, phi - dy * 0.0065));
    }
  });
  renderer.domElement.addEventListener('pointerup', function(e) {
    dragging = false;
    try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (_) {}
    if (Math.hypot(e.clientX - downX, e.clientY - downY) <= 5) {
      const r = renderer.domElement.getBoundingClientRect();
      pt.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      pt.y = -((e.clientY - r.top) / r.height) * 2 + 1;
      rc.setFromCamera(pt, camera);
      const hits = rc.intersectObjects(pickables, false);
      if (hits.length && hits[0].object.userData.tid) {
        onToggleDevice(hits[0].object.userData.tid);
      }
    }
  });
  vp.addEventListener('wheel', function(e) {
    e.preventDefault(); e.stopPropagation();
    const step = Math.max(-3.0, Math.min(3.0, (e.deltaMode === 1 ? e.deltaY * 0.65 : e.deltaY * 0.022)));
    radius = Math.max(5.5, Math.min(40, radius + step));
  }, { passive: false });

  const hemi = new THREE.HemisphereLight(0xe0f2fe, 0x1e293b, 0.72);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff3d6, 1.15);
  sun.position.set(-11, 17, 11);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 1024;
  sun.shadow.mapSize.height = 1024;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 45;
  sun.shadow.camera.left = -15;
  sun.shadow.camera.right = 15;
  sun.shadow.camera.top = 15;
  sun.shadow.camera.bottom = -15;
  scene.add(sun);

  const matGrass = new THREE.MeshStandardMaterial({ color: 0x245c36, roughness: 0.92 });
  const lawn = new THREE.Mesh(new THREE.BoxGeometry(25, 0.32, 25), matGrass);
  lawn.position.set(0, -0.16, 2.0);
  lawn.receiveShadow = true;
  scene.add(lawn);

  const drive = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.06, 11.4), new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.85 }));
  drive.position.set(4.3, 0.03, 5.4);
  drive.receiveShadow = true;
  scene.add(drive);

  const walkway = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.05, 4.2), new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.85 }));
  walkway.position.set(-0.3, 0.025, 3.9);
  walkway.receiveShadow = true;
  scene.add(walkway);

  const slab = new THREE.Mesh(new THREE.BoxGeometry(13.2, 0.18, 7.0), new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.8 }));
  slab.position.set(0, 0.08, -1.5);
  slab.receiveShadow = true;
  scene.add(slab);

  function addFlr(x, z, w, d, col) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ color: col, roughness: 0.75 }));
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, 0.18, z);
    m.receiveShadow = true;
    scene.add(m);
  }
  addFlr(-3.8, -0.1, 5.2, 3.6, 0x855e3c);
  addFlr(-4.6, -3.3, 3.6, 2.8, 0x3b4963);
  addFlr(-1.1, -3.3, 3.4, 2.8, 0x64748b);
  addFlr( 1.5, -1.5, 1.8, 6.4, 0x6b4f3a);
  addFlr( 4.4, -1.5, 4.0, 6.4, 0x3f4652);

  const wallMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.65 });
  const capMat  = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.5 });
  function addW(x, z, w, d, h) {
    h = h || 2.5;
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    m.position.set(x, h / 2 + 0.17, z);
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
    if (h >= 2.1) {
      const cap = new THREE.Mesh(new THREE.BoxGeometry(w + 0.02, 0.06, d + 0.02), capMat);
      cap.position.set(x, h + 0.20, z);
      scene.add(cap);
    }
  }
  addW(0, -4.9, 13.0, 0.22, 2.55);
  addW(-6.4, -1.5, 0.22, 6.8, 2.55);
  addW( 6.4, -1.5, 0.22, 6.8, 2.55);
  addW(-5.9, 1.8, 1.1, 0.22, 2.55);
  addW(-3.8, 1.8, 3.1, 0.22, 0.58);
  addW(-0.9, 1.8, 2.7, 0.22, 2.55);
  addW( 1.5, 1.8, 1.5, 0.22, 0.85);
  addW( 2.4, 1.8, 0.45, 0.22, 2.55);
  addW(-2.9, -1.9, 7.0, 0.16, 2.25);
  addW(-2.8, -3.4, 0.16, 3.0, 2.25);
  addW( 0.6, -1.5, 0.16, 6.6, 2.25);
  addW( 2.4, -1.5, 0.20, 6.6, 2.55);

  const sofa = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.62, 0.9), new THREE.MeshStandardMaterial({ color: 0x334155 }));
  sofa.position.set(-3.8, 0.49, -0.85); sofa.castShadow = true; scene.add(sofa);
  const rug = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.02, 1.6), new THREE.MeshStandardMaterial({ color: 0xcbd5e1 }));
  rug.position.set(-3.8, 0.19, 0.25); scene.add(rug);
  const coffeeTbl = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.34, 0.6), new THREE.MeshStandardMaterial({ color: 0x451a03 }));
  coffeeTbl.position.set(-3.8, 0.35, 0.25); coffeeTbl.castShadow = true; scene.add(coffeeTbl);

  const bed = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.48, 2.05), new THREE.MeshStandardMaterial({ color: 0x4338ca }));
  bed.position.set(-4.8, 0.42, -3.6); bed.castShadow = true; scene.add(bed);
  const pillow = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.14, 0.45), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
  pillow.position.set(-4.8, 0.72, -4.3); scene.add(pillow);

  const desk = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.68, 0.65), new THREE.MeshStandardMaterial({ color: 0x78350f }));
  desk.position.set(1.5, 0.52, -0.6); desk.castShadow = true; scene.add(desk);

  const miniGroup = new THREE.Group();
  const carBody = new THREE.Mesh(new THREE.BoxGeometry(1.72, 0.56, 3.45), new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.35 }));
  carBody.position.set(0, 0.50, 0); carBody.castShadow = true;
  const carRoof = new THREE.Mesh(new THREE.BoxGeometry(1.46, 0.46, 1.85), new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3 }));
  carRoof.position.set(0, 0.98, -0.15); carRoof.castShadow = true;
  miniGroup.add(carBody, carRoof);
  [[-0.86, 1.05],[0.86, 1.05],[-0.86, -1.05],[0.86, -1.05]].forEach(function(wh){
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.18, 14), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
    w.rotation.z = Math.PI / 2; w.position.set(wh[0], 0.30, wh[1]); miniGroup.add(w);
  });
  miniGroup.position.set(4.4, 0.16, -1.65);
  scene.add(miniGroup);

  const pelmet = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.12, 0.18), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
  pelmet.position.set(-3.8, 2.56, 1.72); scene.add(pelmet);
  const glassZ1 = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.85, 0.04), new THREE.MeshStandardMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.32 }));
  glassZ1.position.set(-3.8, 1.56, 1.80); scene.add(glassZ1);
  const cMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.6 });
  const curtL = new THREE.Mesh(new THREE.BoxGeometry(1.48, 2.05, 0.09), cMat); curtL.position.set(-4.55, 1.48, 1.68); curtL.castShadow = true;
  const curtR = new THREE.Mesh(new THREE.BoxGeometry(1.48, 2.05, 0.09), cMat); curtR.position.set(-3.05, 1.48, 1.68); curtR.castShadow = true;
  const sunbeam = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.8), new THREE.MeshBasicMaterial({ color: 0xfef08a, transparent: true, opacity: 0.22 }));
  sunbeam.rotation.x = -Math.PI / 2; sunbeam.position.set(-3.8, 0.20, 0.85); scene.add(sunbeam);
  const z1G = new THREE.Group(); z1G.add(curtL, curtR, glassZ1); scene.add(z1G); regP(z1G, 'z1_curtains');

  const awn = new THREE.Group(); awn.position.set(1.5, 2.42, 1.82);
  const sash = new THREE.Mesh(new THREE.BoxGeometry(1.36, 1.36, 0.06), new THREE.MeshStandardMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.48 }));
  sash.position.y = -0.68; awn.add(sash);
  const blindM = new THREE.Mesh(new THREE.BoxGeometry(1.32, 1.35, 0.05), new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.5 }));
  blindM.position.set(1.5, 1.75, 1.72); blindM.castShadow = true;
  const z2G = new THREE.Group(); z2G.add(awn, blindM); scene.add(z2G); regP(z2G, 'z2_blinds');

  const acB = new THREE.Mesh(new THREE.BoxGeometry(1.38, 0.36, 0.30), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
  acB.position.set(-4.7, 2.25, -4.66); acB.castShadow = true; scene.add(acB); regP(acB, 'z3_ac');
  const acPMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
  const acPts = Array.from({ length: 20 }, function() {
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.048, 6, 6), acPMat);
    p.userData = { u: Math.random(), lx: (Math.random() - 0.5) * 1.15 };
    scene.add(p); return p;
  });

  const fanG = new THREE.Group(); fanG.position.set(-3.8, 2.35, -0.2);
  const fanHub = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.12, 12), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
  fanG.add(fanHub);
  for (let i = 0; i < 4; i++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(1.42, 0.035, 0.17), new THREE.MeshStandardMaterial({ color: 0x78350f }));
    b.rotation.y = (i * Math.PI) / 2; fanG.add(b);
  }
  scene.add(fanG); regP(fanG, 'z4_fan');

  const radMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, emissive: 0xff4500, emissiveIntensity: 0 });
  const radG = new THREE.Group();
  for (let i = 0; i < 8; i++) {
    const f = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.80, 0.19), radMat);
    f.position.set(-1.65 + i * 0.15, 0.62, -4.68); f.castShadow = true; radG.add(f);
  }
  scene.add(radG); regP(radG, 'z5_radiator');

  const garageBayLight = new THREE.PointLight(0xfef3c7, 0, 7);
  garageBayLight.position.set(4.4, 2.4, -1.5); scene.add(garageBayLight);
  const gPnls = Array.from({ length: 5 }, function() {
    const p = new THREE.Mesh(new THREE.BoxGeometry(3.52, 0.44, 0.07), new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.55 }));
    p.castShadow = true; scene.add(p); regP(p, 'z6_garage'); return p;
  });

  const fence = new THREE.Mesh(new THREE.BoxGeometry(8.5, 1.12, 0.14), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
  fence.position.set(-2.2, 0.56, 9.5); fence.castShadow = true; scene.add(fence);
  const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.38, 1.38, 0.38), new THREE.MeshStandardMaterial({ color: 0x334155 }));
  pillar.position.set(2.15, 0.69, 9.5); pillar.castShadow = true; scene.add(pillar);
  const gateBeaconMat = new THREE.MeshBasicMaterial({ color: 0x22c55e });
  const gateBeacon = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 10), gateBeaconMat);
  gateBeacon.position.set(2.15, 1.46, 9.5); scene.add(gateBeacon);
  const gateM = new THREE.Mesh(new THREE.BoxGeometry(4.2, 1.15, 0.09), new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4 }));
  gateM.position.set(4.3, 0.62, 9.5); gateM.castShadow = true; scene.add(gateM); regP(gateM, 'z7_gate');

  const sprCoords = [[-4.8, 4.2], [-1.6, 4.2], [-4.8, 7.2], [-1.6, 7.2]];
  const sprHeads = [], drops = [];
  const dMat = new THREE.MeshBasicMaterial({ color: 0x7dd3fc });
  sprCoords.forEach(function(pair) {
    const sx = pair[0], sz = pair[1];
    const h = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.30, 8), new THREE.MeshStandardMaterial({ color: 0x0284c7 }));
    h.position.set(sx, 0.04, sz); scene.add(h); regP(h, 'z8_sprinklers'); sprHeads.push(h);
    for (let k = 0; k < 14; k++) {
      const dr = new THREE.Mesh(new THREE.SphereGeometry(0.045, 5, 5), dMat);
      dr.userData = { sx: sx, sz: sz, a: (k / 14) * Math.PI * 2, t: Math.random() };
      scene.add(dr); drops.push(dr);
    }
  });

  const bolMats = [], bolLights = [];
  [3.2, 5.1, 7.0, 8.8].forEach(function(bz) {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.72, 10), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
    post.position.set(2.05, 0.36, bz); post.castShadow = true; scene.add(post); regP(post, 'z0_driveway');
    const bm = new THREE.MeshBasicMaterial({ color: 0xffedd5 });
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.10, 0.18, 10), bm);
    cap.position.set(2.05, 0.78, bz); scene.add(cap);
    const pl = new THREE.PointLight(0xffedd5, 1.1, 5.5);
    pl.position.set(2.25, 0.85, bz); scene.add(pl);
    bolMats.push(bm); bolLights.push(pl);
  });

  const anchors = {
    z1_curtains:   new THREE.Vector3(-3.8, 2.85,  1.8),
    z2_blinds:     new THREE.Vector3( 1.5, 2.85,  1.8),
    z3_ac:         new THREE.Vector3(-4.7, 2.75, -4.66),
    z4_fan:        new THREE.Vector3(-3.8, 2.75, -0.2),
    z5_radiator:   new THREE.Vector3(-1.15,1.55, -4.68),
    z6_garage:     new THREE.Vector3( 4.35,2.85,  1.8),
    z7_gate:       new THREE.Vector3( 4.3, 1.85,  9.5),
    z8_sprinklers: new THREE.Vector3(-3.2, 1.25,  5.7),
    z0_driveway:   new THREE.Vector3( 2.05,1.45,  6.0)
  };
  const lblEls = {}, activeActionNote = {};

  function devStatusShort(d) {
    if (d.kind === 'curtain' || d.kind === 'blind') return d.position > 3 ? ('OPEN ' + d.position + '%') : 'CLOSED';
    if (d.kind === 'garage' || d.kind === 'gate') return d.open ? ('OPEN ' + d.position + '%') : 'CLOSED';
    if (d.kind === 'ac') return d.active ? ((d.hvacMode || 'cool').toUpperCase() + ' ' + d.targetTemp + '°C') : 'OFF';
    if (d.kind === 'radiator') return d.active ? ('HEAT ' + (d.targetTemp || 24) + '°C') : 'OFF';
    if (d.kind === 'fan') return d.active ? ('SPIN ' + d.speed + '%') : 'OFF';
    if (d.kind === 'sprinkler') return d.active ? ('SPRAY ' + d.flowPct + '%') : 'OFF';
    if (d.kind === 'rgb_light') return d.on ? ('ON' + (d.presetName ? ' · ' + d.presetName : ' ' + d.bri + '%')) : 'OFF';
    return '';
  }
  function devExpectedClickHint(d) {
    if (d.kind === 'curtain' || d.kind === 'blind') return d.position > 10 ? '➔ Click: Close (0%)' : '➔ Click: Open (100%)';
    if (d.kind === 'garage') return d.open ? '➔ Click: Roll Down' : '➔ Click: Roll Up';
    if (d.kind === 'gate') return d.open ? '➔ Click: Slide Shut' : '➔ Click: Slide Open';
    if (d.kind === 'ac' || d.kind === 'radiator') return d.active ? '➔ Click: Turn OFF' : '➔ Click: Start HVAC';
    if (d.kind === 'fan') return d.active ? '➔ Click: Stop Fan' : '➔ Click: Spin Fan';
    if (d.kind === 'sprinkler') return d.active ? '➔ Click: Stop Spray' : '➔ Click: Start Spray';
    return d.on ? '➔ S+ or Click: Turn OFF' : '➔ S+ or Click: Turn ON';
  }
  function pulseBadge(id, note) {
    if (note) activeActionNote[id] = { text: note, until: Date.now() + 3500 };
    const el = lblEls[id]; if (!el) return;
    if (el._pt) clearTimeout(el._pt);
    el.classList.remove('pulse-act'); void el.offsetWidth; el.classList.add('pulse-act');
    el._pt = setTimeout(function(){ el.classList.remove('pulse-act'); }, 850);
  }

  const anim = { c: 0.85, b: 0.70, g: 0, gt: 0, fv: 0, sp: 0 };
  const clock = new THREE.Clock();

  function loop() {
    requestAnimationFrame(loop);
    if (vp.offsetParent === null) return;
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    const stateMap = getStateMap();

    curTheta = THREE.MathUtils.lerp(curTheta, theta, 0.14);
    curPhi   = THREE.MathUtils.lerp(curPhi, phi, 0.14);
    curRadius = THREE.MathUtils.lerp(curRadius, radius, 0.16);
    curTarget.lerp(target, 0.14);
    camera.position.set(
      curTarget.x + curRadius * Math.sin(curPhi) * Math.sin(curTheta),
      curTarget.y + curRadius * Math.cos(curPhi),
      curTarget.z + curRadius * Math.sin(curPhi) * Math.cos(curTheta)
    );
    camera.lookAt(curTarget);

    const sc = stateMap.get('scene_mode') || { scene: 'day' };
    const skyHex = sc.scene === 'day' ? (opts.darkDefault ? 0x1e3a5f : 0xbae6fd)
                 : (sc.scene === 'sunset' ? (opts.darkDefault ? 0x312e81 : 0xc7d2fe) : 0x090f1d);
    scene.background.lerp(new THREE.Color(skyHex), 0.06);
    sun.intensity = THREE.MathUtils.lerp(sun.intensity, sc.scene === 'day' ? 1.22 : (sc.scene === 'sunset' ? 0.85 : 0.18), 0.06);

    const d1 = stateMap.get('z1_curtains');
    if (d1) {
      anim.c = THREE.MathUtils.lerp(anim.c, (d1.position || 0) / 100, 0.1);
      const ws = Math.max(0.14, 1 - anim.c * 0.82);
      curtL.scale.x = ws; curtR.scale.x = ws;
      curtL.position.x = -5.28 + (1.48 * ws) / 2;
      curtR.position.x = -2.32 - (1.48 * ws) / 2;
      sunbeam.scale.x = Math.max(0.05, anim.c);
      sunbeam.material.opacity = sc.scene === 'day' ? (0.24 * anim.c) : 0.03;
    }
    const d2 = stateMap.get('z2_blinds');
    if (d2) {
      anim.b = THREE.MathUtils.lerp(anim.b, (d2.position || 0) / 100, 0.1);
      const cf = Math.max(0.06, 1 - anim.b * 0.92);
      blindM.scale.y = cf; blindM.position.y = 2.42 - (1.35 * cf) / 2;
      awn.rotation.x = -anim.b * 0.52;
    }
    const d3 = stateMap.get('z3_ac');
    if (d3) {
      acPMat.color.setHex(d3.hvacMode === 'heat' ? 0xf97316 : 0x38bdf8);
      acPts.forEach(function(p) {
        p.visible = Boolean(d3.active); if (!d3.active) return;
        p.userData.u = (p.userData.u + dt * 1.15) % 1;
        const u = p.userData.u;
        p.position.set(-4.7 + p.userData.lx, 2.05 - u * 1.35, -4.46 + u * 2.05);
      });
    }
    const d4 = stateMap.get('z4_fan');
    if (d4) { anim.fv = THREE.MathUtils.lerp(anim.fv, d4.active ? ((d4.speed || 50) / 100) * 14 : 0, 0.06); fanG.rotation.y += anim.fv * dt; }
    const d5 = stateMap.get('z5_radiator');
    if (d5) { radMat.emissiveIntensity = THREE.MathUtils.lerp(radMat.emissiveIntensity, d5.active ? Math.max(0.35, (d5.valvePct || 75) / 100) : 0, 0.08); }
    const d6 = stateMap.get('z6_garage');
    if (d6) {
      anim.g = THREE.MathUtils.lerp(anim.g, (d6.position || 0) / 100, 0.08);
      garageBayLight.intensity = anim.g * 1.35;
      gPnls.forEach(function(p, i) {
        const s = i * 0.45 + anim.g * 2.35;
        if (s <= 2.25) { p.position.set(4.35, 0.40 + s, 1.80); p.rotation.x = 0; }
        else { p.position.set(4.35, 2.65, 1.80 - (s - 2.25)); p.rotation.x = Math.PI / 2; }
      });
    }
    const d7 = stateMap.get('z7_gate');
    if (d7) {
      const tgtG = (d7.position || 0) / 100;
      anim.gt = THREE.MathUtils.lerp(anim.gt, tgtG, 0.08);
      gateM.position.x = 4.3 - anim.gt * 4.15;
      const moving = Math.abs(anim.gt - tgtG) > 0.02;
      gateBeaconMat.color.setHex(moving ? (Math.sin(t * 14) > 0 ? 0xf59e0b : 0x451a03) : (d7.open ? 0x38bdf8 : 0x22c55e));
    }
    const d8 = stateMap.get('z8_sprinklers');
    if (d8) {
      anim.sp = THREE.MathUtils.lerp(anim.sp, d8.active ? ((d8.flowPct || 85) / 100) : 0, 0.1);
      matGrass.color.lerp(new THREE.Color(d8.active ? 0x166534 : 0x245c36), 0.04);
      sprHeads.forEach(function(h){ h.position.y = 0.04 + anim.sp * 0.16; });
      drops.forEach(function(dr) {
        dr.visible = anim.sp > 0.06; if (!dr.visible) return;
        dr.userData.t = (dr.userData.t + dt * 1.55) % 1;
        const u = dr.userData.t, a = dr.userData.a + t * 0.9;
        dr.position.set(dr.userData.sx + Math.cos(a) * u * 1.85 * anim.sp, 0.22 + Math.sin(u * Math.PI) * 1.3 * anim.sp, dr.userData.sz + Math.sin(a) * u * 1.85 * anim.sp);
      });
    }
    const d0 = stateMap.get('z0_driveway');
    if (d0) {
      bolLights.forEach(function(pl, idx) {
        if (sc.scene === 'party') {
          const c = new THREE.Color().setHSL(((t * 110 + idx * 55) % 360) / 360, 0.95, 0.55);
          pl.color.copy(c); bolMats[idx].color.copy(c); pl.intensity = 1.7;
        } else if (!d0.on) {
          pl.intensity = 0; bolMats[idx].color.setHex(0x334155);
        } else {
          const c = (d0.colorMode === 'hs' && (d0.sat || 0) > 8)
            ? new THREE.Color().setHSL((d0.hue || 0) / 360, (d0.sat || 100) / 100, 0.55)
            : new THREE.Color().lerpColors(new THREE.Color(0xe0f2fe), new THREE.Color(0xffb454), ((d0.ct || 260) - 153) / 217);
          pl.color.copy(c); bolMats[idx].color.copy(c); pl.intensity = ((d0.bri || 80) / 100) * 1.6;
        }
      });
    }

    const vw = vp.clientWidth, vh = vp.clientHeight;
    if (lblLayer && vw && vh) {
      stateMap.forEach(function(d) {
        const anc = anchors[d.id]; if (!anc) return;
        let el = lblEls[d.id];
        if (!el) {
          el = document.createElement('div');
          el.className = 'm3d-lbl';
          el.onclick = function(ev){ ev.stopPropagation(); onToggleDevice(d.id, devExpectedClickHint(d).replace('➔ Click: ', '')); };
          lblLayer.appendChild(el);
          lblEls[d.id] = el;
        }
        const v = anc.clone().project(camera);
        if (v.z > 1) { el.style.display = 'none'; return; }
        el.style.display = 'block';
        el.style.left = ((v.x * 0.5 + 0.5) * vw) + 'px';
        el.style.top  = ((-v.y * 0.5 + 0.5) * vh) + 'px';
        const shortTitle = d.name.replace(/^\[Virtual\]\s*/, '');
        const isOn = (d.position !== undefined) ? (d.position > 3) : Boolean(d.active ?? d.on);
        el.classList.toggle('on', isOn);
        const noteObj = activeActionNote[d.id];
        const liveNote = (noteObj && Date.now() < noteObj.until) ? (' <span style="color:#ea580c;font-weight:800">⚡ ' + noteObj.text + '</span>') : '';
        const nextHtml = shortTitle + ': <b>' + devStatusShort(d) + '</b>' + liveNote + '<span class="exp-hint">' + devExpectedClickHint(d) + '</span>';
        if (el._lastHtml !== nextHtml) { el.innerHTML = nextHtml; el._lastHtml = nextHtml; }
      });
    }
    renderer.render(scene, camera);
  }
  loop();

  window.addEventListener('resize', function() {
    if (!vp.clientWidth || !vp.clientHeight) return;
    camera.aspect = vp.clientWidth / vp.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(vp.clientWidth, vp.clientHeight);
  });

  return { setCam: setCam, zoomBy: zoomBy, pulseBadge: pulseBadge, devExpectedClickHint: devExpectedClickHint };
}

const stateMap = new Map();
let remotes = [], selRem = 0, zonesByDev = {};
const ACT_TO_SVG = { on:['on'], off:['off'], brightness:['brightness'], saturation:['saturation','kelvin'], color_temp:['kelvin','saturation'], kelvin:['kelvin','saturation'], hue:['hue'], mode_speed_up:['mode_speed_up','speed_up'], mode_speed_down:['mode_speed_down','speed_down'], set_white:['set_white'], mode:['mode','next_mode'], night_mode:['off','night_mode'] };

document.getElementById('remDock').addEventListener('pointerdown', (e)=>e.stopPropagation());
document.getElementById('remDock').addEventListener('wheel', (e)=>e.stopPropagation());

async function sendCmd(id, patch) {
  await fetch('/api/command', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.assign({ id }, patch)) });
}

const eng = createCutawaySmartHome3D({
  viewport: document.getElementById('vp'),
  darkDefault: false,
  labelsLayer: document.getElementById('labelsLayer'),
  getStateMap: () => stateMap,
  onToggleDevice: (id, expTxt) => {
    const d = stateMap.get(id); if (!d) return;
    const patch = d.position !== undefined ? { position: d.position > 10 ? 0 : 100, open: !(d.position > 10) } : (d.active !== undefined ? { active: !d.active } : { on: !d.on });
    document.getElementById('toastBar').innerHTML = `🟠 <b>[3D Direct Click]</b> ${d.name.replace('[Virtual] ','')} &nbsp;➔&nbsp; <b style="color:#ea580c">${expTxt || 'Toggled'}</b>`;
    eng.pulseBadge(id, expTxt || 'Toggled');
    sendCmd(id, patch);
  }
});

function getDevId(r){ return Number(r.device_id || r.id || parseInt(String(r.hex_id||r.hex||'0').replace(/^0x/i,''),16) || 0); }

function renderSidebar() {
  const box = document.getElementById('sideList');
  box.innerHTML = Array.from(stateMap.values()).map((d) => {
    const isPos = d.position !== undefined;
    const isOn = isPos ? d.position > 3 : Boolean(d.active ?? d.on);
    const slider = isPos ? `<input type="range" min="0" max="100" value="${d.position||0}" onchange="sendCmd('${d.id}',{position:Number(this.value),open:Number(this.value)>3})">`
                 : (d.speed !== undefined ? `<input type="range" min="0" max="100" value="${d.speed||0}" onchange="sendCmd('${d.id}',{speed:Number(this.value),active:Number(this.value)>0})">` : '');
    const toggleObj = isPos ? `{position:${isOn?0:100},open:${!isOn}}` : (d.active !== undefined ? `{active:${!isOn}}` : `{on:${!isOn}}`);
    return `<div class="dcard">
      <div class="dcard-hdr"><span>${d.name.replace('[Virtual] ','')}</span><button class="chip" style="background:${isOn?'#16a34a':'#334155'}" onclick="eng.pulseBadge('${d.id}');sendCmd('${d.id}',${toggleObj})">${isOn?'ON / OPEN':'OFF'}</button></div>
      ${slider}
    </div>`;
  }).join('');
}

function renderDock() {
  if (!remotes.length || !window.MiBoxerCatalog) return;
  const cur = remotes[selRem] || remotes[0], devId = getDevId(cur), curZ = zonesByDev[devId] ?? 1;
  document.getElementById('rdTabs').innerHTML = remotes.map((r,i)=>`<button class="rd-btn ${i===selRem?'active':''}" onclick="selRem=${i};renderDock()">${r.visual_model||r.model||'REM'}</button>`).join('');
  const maxZ = Math.min(Math.max(Number(cur.num_zones||8),1),8);
  document.getElementById('rdZones').innerHTML = [0,...Array.from({length:maxZ},(_,k)=>k+1)].map((z)=>`<button class="rd-btn ${curZ===z?'active':''}" onclick="zonesByDev[${devId}]=${z};renderDock()">${z===0?'All':'Z'+z}</button>`).join('');
  const vm = cur.visual_model || cur.model || '', rtype = cur.remote_type || 'fut089';
  const mod = MiBoxerCatalog.MODELS.find((m)=>m.id===vm) || MiBoxerCatalog.MODELS.find((m)=>m.proto===rtype) || MiBoxerCatalog.MODELS[0];
  const wrap = document.getElementById('rdSvg');
  wrap.innerHTML = MiBoxerCatalog.renderModelSvg(mod, { size:'thumb', uid:'full3d' });
  wrap.querySelectorAll(`.mbx-hit[data-act="zone"][data-zone="${curZ}"]`).forEach((el)=>el.classList.add('zone-active'));
  wrap.querySelectorAll('.mbx-hit').forEach((el) => {
    el.onclick = async (e) => {
      e.stopPropagation();
      const act = el.getAttribute('data-act') || 'on', zAttr = el.getAttribute('data-zone');
      if (zAttr !== null && zAttr !== '') { zonesByDev[devId] = Number(zAttr); renderDock(); }
      if (act === 'zone') return;
      let val = el.getAttribute('data-val') !== null ? Number(el.getAttribute('data-val')) : undefined;
      if (val === undefined) {
        const rect = el.getBoundingClientRect();
        if (act === 'hue' && rect.width) { let deg = Math.round((Math.atan2(e.clientY-(rect.top+rect.height/2), e.clientX-(rect.left+rect.width/2))*180)/Math.PI+90); if(deg<0)deg+=360; val=deg%360; }
        else if (rect.width) { const f = rect.height>rect.width*1.3 ? (1-(e.clientY-rect.top)/rect.height) : ((e.clientX-rect.left)/rect.width); const rp = Math.max(0,Math.min(100,Math.round(f*100))); val = rp <= 6 ? 0 : (rp >= 94 ? 100 : rp); }
        else val = 100;
      }
      const apiAct = act === 'kelvin' ? 'color_temp' : act;
      flashDock(devId, apiAct, zonesByDev[devId]??1, 'ui', val);
      await fetch('/api/virtual_send', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ device_id:devId, remote_type:rtype, group_id:zonesByDev[devId]??1, action:apiAct, value:val }) });
    };
  });
}

function flashDock(devId, act, zone, src, val) {
  const idx = remotes.findIndex((r)=>getDevId(r)===Number(devId));
  if (idx >= 0 && idx !== selRem) selRem = idx;
  zonesByDev[devId] = Number(zone);
  renderDock();
  const isRf = src !== 'ui', cls = isRf ? 'fire-rf' : 'fire-ui';
  const wrap = document.getElementById('rdSvg');
  (ACT_TO_SVG[act]||[act]).forEach((a)=>wrap.querySelectorAll(`.mbx-hit[data-act="${a}"]`).forEach((el)=>{ el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),750); }));
  wrap.querySelectorAll(`.mbx-hit[data-act="zone"][data-zone="${zone}"]`).forEach((el)=>{ el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),750); });
  const dk = document.getElementById('remDock'); dk.classList.remove('hit-rf','hit-ui'); dk.classList.add(isRf?'hit-rf':'hit-ui'); setTimeout(()=>dk.classList.remove('hit-rf','hit-ui'),750);
  const bd = document.getElementById('rdBadge'); bd.style.background=isRf?'#14532d':'#78350f'; bd.style.color='#fff'; bd.textContent=isRf?'🟢 PHYSICAL RF':'🟠 UI CLICK';
}

async function boot() {
  const [st, rList] = await Promise.all([
    fetch('/api/state').then((r)=>r.json()).catch(()=>({})),
    fetch('/api/remotes').then((r)=>r.json()).catch(()=>[])
  ]);
  (st.devices||[]).forEach((d)=>stateMap.set(d.id, d));
  remotes = Array.isArray(rList) ? rList : (st.remotes || []);
  const b8 = remotes.findIndex((r)=>String(r.visual_model||r.model||'').toUpperCase().includes('B8')); if (b8>=0) selRem = b8;
  renderSidebar(); renderDock();

  const es = new EventSource('/api/stream');
  es.addEventListener('init', (e)=>{ const j=JSON.parse(e.data); (j.devices||[]).forEach((d)=>stateMap.set(d.id,d)); renderSidebar(); });
  es.addEventListener('state_patch', (e)=>{ const j=JSON.parse(e.data); if(j.device){ stateMap.set(j.device.id,j.device); renderSidebar(); } });
  es.addEventListener('rf_event', (e)=>{
    const j = JSON.parse(e.data);
    (j.updated||[]).forEach((d)=>{ stateMap.set(d.id,d); eng.pulseBadge(d.id, j.event?.action?.toUpperCase()); });
    renderSidebar();
    if (j.event) {
      const ev = j.event, devId = ev.device_id || parseInt(String(ev.hex||'0').replace(/^0x/i,''),16) || 0;
      flashDock(devId, ev.action, ev.zone, ev.source || 'rf', ev.value);
      const tag = ev.source === 'ui' ? '🟠 [UI Click]' : '🟢 [Physical RF]';
      const updNames = (j.updated||[]).map((u)=>u.name.replace('[Virtual] ','')).join(', ') || 'No Sandbox Target';
      document.getElementById('toastBar').innerHTML = `<b>${tag}</b> ${ev.remoteName||ev.hex} • Zone ${ev.zone} <code>${ev.action}${ev.value!==undefined?'('+ev.value+(ev.pct!==undefined?' → '+ev.pct+'%':'')+')':''}</code> &nbsp;➔&nbsp; <b style="color:#ea580c">${updNames}</b>`;
    }
  });
}
boot();
</script>
</body>
